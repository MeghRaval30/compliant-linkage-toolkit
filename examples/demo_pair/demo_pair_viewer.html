<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cmtool viewer - demo_pair</title>
<style>
  :root {
      color-scheme: light dark;
      --surface: #fcfcfb;
      --plane: #f9f9f7;
      --primary: #0b0b0b;
      --secondary: #52514e;
      --muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11,11,11,0.10);
      --critical: #d03b3b;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19;
      --plane: #0d0d0d;
      --primary: #ffffff;
      --secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--plane);
    color: var(--primary);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    overflow-x: hidden;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 2px; }
  .sub { color: var(--secondary); font-size: 0.85rem; margin: 0 0 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .banner {
    border-left: 4px solid var(--critical);
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 0.86rem;
  }
  .banner strong { color: var(--critical); }
  .banner code { font-size: 0.8rem; color: var(--secondary); word-break: break-all; }
  svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
  h2.chart-title { font-size: 0.95rem; margin: 0 0 2px; font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  input[type=range] {
    flex: 1 1 200px; min-width: 160px; height: 44px; accent-color: var(--secondary);
  }
  button {
    font: inherit; font-size: 0.9rem; min-height: 44px; min-width: 64px;
    padding: 0 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--plane); color: var(--primary);
  }
  button[aria-pressed="true"] { border-color: var(--secondary); }
  .angle { font-variant-numeric: tabular-nums; font-size: 0.95rem; min-width: 128px; }
  .angle b { font-size: 1.25rem; }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .readouts {
    display: grid; gap: 10px; margin-top: 12px;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  }
  .stat { border-top: 2px solid var(--axis); padding-top: 6px; }
  .stat .k { font-size: 0.72rem; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.03em; }
  .stat .v { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .stat .u { font-size: 0.78rem; color: var(--secondary); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
            font-size: 0.82rem; color: var(--secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 22px; height: 0; border-top-width: 3px; border-top-style: solid; }
  .note { font-size: 0.8rem; color: var(--secondary); margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.8rem;
          font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center;
                    font-size: 0.9rem; }
  .scroll { overflow-x: auto; }
  @media (max-width: 460px) {
    body { padding: 12px; }
    button { min-width: 0; padding: 0 10px; font-size: 0.85rem; }
    .angle { min-width: 104px; }
  }
  footer { font-size: 0.75rem; color: var(--muted); margin-top: 6px; word-break: break-all; }
  footer code { font-size: 0.72rem; }
</style>
</head>

<script>/*
 * Drawing a ViewerScene, in one place.
 *
 * Two things render scenes: the self-contained HTML viewer (cmtool view), which
 * inlines this file so the output needs nothing from the network, and the local
 * UI (cmtool ui), which serves it. Sharing the file is the point -- the scene

    var m = scene.models[key];
    return m && m.frames && m.frames[index] ? m.frames[index] : null;
  }

  function has(scene, key) {
    return Object.prototype.hasOwnProperty.call(scene.models, key);
  }

  function drawMechanism(svg, scene, style, index, options) {
    var opts = options || {};
    var show = opts.show || { rigid: true, prbm: true, fea: true, paths: true, trueScale: false };
    var host = opts.host;
    var b = scene.bounds_mm;
    var x0 = b[0], y0 = b[1], x1 = b[2], y1 = b[3];
    var flip = y0 + y1;
    var X = function (v) { return v; };
    var Y = function (v) { return flip - v; };
    var pts = function (poly) {
      return poly
        .map(function (p) { return X(p[0]) + "," + Y(p[1]); })
        .join(" ");
    };

    clear(svg);
    svg.setAttribute("viewBox", x0 + " " + y0 + " " + (x1 - x0) + " " + (y1 - y0));
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    /* An inline SVG with only a viewBox has no intrinsic height, so height:auto
     * resolves to whatever the box gives it. Stating the ratio pins it. */
    svg.style.aspectRatio = (x1 - x0) + " / " + (y1 - y0);

    if (show.paths) {
      ["rigid", "prbm", "fea", "measured"].forEach(function (key) {
        if (!has(scene, key) || !show[key]) return;
        svg.appendChild(
          el("polyline", {
            points: pts(scene.models[key].path),
            fill: "none",
            stroke: colourOf(style, key, host),
            "stroke-width": 0.7,
            "stroke-dasharray": style.series[key].dash || null,
            "stroke-linecap": "round",
            opacity: 0.95,
          })
        );
      });
    }

    if (scene.ground_polyline_mm && scene.ground_polyline_mm.length === 2) {
      svg.appendChild(
        el("polyline", {
          points: pts(scene.ground_polyline_mm),
          fill: "none",
          stroke: ink("axis", host),
          "stroke-width": scene.link_width_mm,
          "stroke-linecap": "round",
          opacity: 0.55,
        })
      );
    }

    /* The FEA part: links as true-width bars with a hairline ring, then the
     * flexures element by element so each wears its own strain. */
    var fea = show.fea ? frameOf(scene, "fea", index) : null;
    if (fea) {
      Object.keys(fea.links).forEach(function (body) {
        svg.appendChild(
          el("polyline", {
            points: pts(fea.links[body]),
            fill: "none",
            stroke: ink("axis", host),
            "stroke-width": scene.link_width_mm + 1.2,
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
          })
        );
        svg.appendChild(
          el("polyline", {
            points: pts(fea.links[body]),
            fill: "none",
            stroke: ink("grid", host),
            "stroke-width": scene.link_width_mm,
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
          })
        );
      });
      Object.keys(fea.flexures).forEach(function (joint) {
        var poly = fea.flexures[joint];
        var strain = fea.strain[joint];
        var trueWidth = scene.flexure_thickness_mm[joint];
        var width = show.trueScale
          ? trueWidth
          : Math.max(trueWidth, style.minFlexureMm);
        for (var e = 0; e < strain.length; e++) {
          svg.appendChild(
            el("line", {
              x1: X(poly[e][0]),
              y1: Y(poly[e][1]),
              x2: X(poly[e + 1][0]),
              y2: Y(poly[e + 1][1]),
              stroke: strainColour(strain[e] / scene.allowable_strain, style, host),
              "stroke-width": width,
              "stroke-linecap": "round",
            })
          );
        }
      });
    }

    /* Ghost outlines of the pin-jointed models at the same input angle. */
    ["rigid", "prbm"].forEach(function (key) {
      var frame = show[key] ? frameOf(scene, key, index) : null;
      if (!frame) return;
      var dash = style.series[key].dash || null;
      Object.keys(frame.links).forEach(function (body) {
        if (body === scene.ground_body) return;
        svg.appendChild(
          el("polyline", {
            points: pts(frame.links[body]),
            fill: "none",
            stroke: colourOf(style, key, host),
            "stroke-width": 1.1,
            "stroke-dasharray": dash,
            "stroke-linecap": "round",
          })
        );
      });
      Object.keys(frame.links).forEach(function (body) {
        frame.links[body].forEach(function (p) {
          svg.appendChild(
            el("circle", {
              cx: X(p[0]),
              cy: Y(p[1]),
              r: 1.2,
              fill: "none",
              stroke: colourOf(style, key, host),
              "stroke-width": 0.8,
            })
          );
        });
      });
    });

    ["rigid", "prbm", "fea"].forEach(function (key) {
      var frame = show[key] ? frameOf(scene, key, index) : null;
      if (!frame) return;
      svg.appendChild(
        el("circle", {
          cx: X(frame.output[0]),
          cy: Y(frame.output[1]),
          r: key === "fea" ? 2.2 : 1.6,
          fill: colourOf(style, key, host),
          stroke: ink("surface", host),
          "stroke-width": 0.6,
        })
      );
    });
  }

  /* --- line charts ---------------------------------------------------- */

  function chartFrame(svg, opts) {
    var width = Math.max(320, Math.min(760, opts.width || 520));
    var height = Math.round(width * (opts.ratio || 0.42)) + 40;
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.style.aspectRatio = width + " / " + height;
    return { w: width, h: height, l: 56, r: 16, t: 14, b: 34 };
  }

  function axes(svg, box, scales, opts, host) {
    var ticks = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      return scales.lo + f * (scales.top - scales.lo);
    });
    ticks.forEach(function (value) {
      svg.appendChild(
        el("line", {
          x1: box.l,
          y1: scales.py(value),
          x2: box.w - box.r,
          y2: scales.py(value),
          stroke: value === 0 ? ink("axis", host) : ink("grid", host),
          "stroke-width": 1,
        })
      );
      var label = el("text", {
        x: box.l - 8,
        y: scales.py(value) + 4,
        "text-anchor": "end",
        fill: ink("muted", host),
        "font-size": 11,
      });
      label.textContent = opts.format ? opts.format(value) : value.toFixed(2);
      svg.appendChild(label);
    });
    var xLabel = el("text", {
      x: (box.l + box.w - box.r) / 2,
      y: box.h - 8,
      "text-anchor": "middle",
      fill: ink("muted", host),
      "font-size": 11,
    });
    xLabel.textContent = opts.xLabel || "input angle (deg)";
    svg.appendChild(xLabel);
  }

  function makeScales(box, angles, lo, top) {
    var a0 = Math.min(angles[0], angles[angles.length - 1]);
    var a1 = Math.max(angles[0], angles[angles.length - 1]);
    return {
      lo: lo,
      top: top,
      px: function (a) {
        return box.l + ((a - a0) / (a1 - a0 || 1)) * (box.w - box.l - box.r);
      },
      py: function (v) {
        return (
          box.h -
          box.b -
          ((v - lo) / (top - lo || 1)) * (box.h - box.t - box.b)
        );
      },
    };
  }

  function series(svg, scales, xs, ys, colour, dash, width) {
    var points = ys
      .map(function (v, i) { return scales.px(xs[i]) + "," + scales.py(v); })
      .join(" ");
    svg.appendChild(
      el("polyline", {
        points: points,
        fill: "none",
        stroke: colour,
        "stroke-width": width || 2,
        "stroke-dasharray": dash || null,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      })
    );
  }

  function crosshair(svg, box, scales, x, host) {
    svg.appendChild(
      el("line", {
        x1: scales.px(x),
        y1: box.t,
        x2: scales.px(x),
        y2: box.h - box.b,
        stroke: ink("secondary", host),
        "stroke-width": 1,
        "stroke-dasharray": "3 3",
      })
    );
  }

  function tag(svg, x, y, text, colour) {
    var node = el("text", {
      x: x - 4,
      y: y - 7,
      "text-anchor": "end",
      fill: colour,
      "font-size": 11,
      "font-weight": "600",
    });
    node.textContent = text;
    svg.appendChild(node);
  }

  /* How far each model's coupler path sits from the reference path. The three
   * predictions differ by tenths of a millimetre across a part 140 mm wide, so
   * drawn on top of each other they are one curve -- this is the chart that
   * shows the difference, and it is the quantity the go/no-go is stated
   * against. */
  function drawDeviation(svg, scene, style, index, options) {
    var opts = options || {};
    var host = opts.host;
    clear(svg);
    var keys = ["prbm", "fea", "measured"].filter(function (k) {
      return (
        has(scene, k) &&
        scene.models[k].deviation_mm &&
        k !== scene.deviation_reference
      );
    });
    if (!keys.length) return keys;

    var box = chartFrame(svg, opts);
    var top = 0;
    keys.forEach(function (k) {
      scene.models[k].deviation_mm.forEach(function (v) {
        top = Math.max(top, v);
      });
    });
    var scales = makeScales(box, scene.input_angles_deg, 0, top > 0 ? top * 1.15 : 1);
    axes(svg, box, scales, { xLabel: opts.xLabel }, host);

    keys.forEach(function (key) {
      var m = scene.models[key];
      var xs = key === "measured" ? m.input_angles_deg : scene.input_angles_deg;
      series(
        svg,
        scales,
        xs,
        m.deviation_mm,
        colourOf(style, key, host),
        style.series[key].dash,
        key === "measured" ? style.series[key].width : 2
      );
      var last = m.deviation_mm.length - 1;
      tag(
        svg,
        scales.px(xs[last]),
        scales.py(m.deviation_mm[last]),
        style.series[key].label,
        colourOf(style, key, host)
      );
    });

    crosshair(svg, box, scales, scene.input_angles_deg[index], host);
    keys.forEach(function (key) {
      if (key === "measured") return;
      svg.appendChild(
        el("circle", {
          cx: scales.px(scene.input_angles_deg[index]),
          cy: scales.py(scene.models[key].deviation_mm[index]),
          r: 4,
          fill: colourOf(style, key, host),
          stroke: ink("surface", host),
          "stroke-width": 1.5,
        })
      );
    });
    return keys;
  }

  /* Input torque. With a prescribed input the path is fixed by geometry, so the
   * path cannot discriminate between stiffness models at all -- torque can, and
   * this is where the two differ by about half. */
  function drawTorque(svg, scene, style, index, options) {
    var opts = options || {};
    var host = opts.host;
    clear(svg);
    var keys = ["prbm", "fea"].filter(function (k) {
      return has(scene, k) && scene.models[k].torque_nmm;
    });
    if (!keys.length) return keys;

    var box = chartFrame(svg, opts);
    var top = 0;
    keys.forEach(function (k) {
      scene.models[k].torque_nmm.forEach(function (v) {
        top = Math.max(top, Math.abs(v));
      });
    });
    var scales = makeScales(box, scene.input_angles_deg, 0, top > 0 ? top * 1.15 : 1);
    axes(svg, box, scales, { xLabel: opts.xLabel, format: function (v) { return v.toFixed(0); } }, host);

    keys.forEach(function (key) {
      var values = scene.models[key].torque_nmm.map(Math.abs);
      series(
        svg,
        scales,
        scene.input_angles_deg,
        values,
        colourOf(style, key, host),
        style.series[key].dash
      );
      var last = values.length - 1;
      tag(
        svg,
        scales.px(scene.input_angles_deg[last]),
        scales.py(values[last]),
        style.series[key].label,
        colourOf(style, key, host)
      );
    });

    crosshair(svg, box, scales, scene.input_angles_deg[index], host);
    keys.forEach(function (key) {
      svg.appendChild(
        el("circle", {
          cx: scales.px(scene.input_angles_deg[index]),
          cy: scales.py(Math.abs(scene.models[key].torque_nmm[index])),
          r: 4,
          fill: colourOf(style, key, host),
          stroke: ink("surface", host),
          "stroke-width": 1.5,
        })
      );
    });
    return keys;
  }

  /* Peak flexure strain through the arc, against the allowable. Each flexure is
   * printed unstressed at mid-arc, so every curve is a V. */
  function drawStrain(svg, scene, style, index, options) {
    var opts = options || {};
    var host = opts.host;
    clear(svg);
    var fea = scene.models.fea;
    if (!fea || !fea.frames || !fea.frames.length) return [];

    var box = chartFrame(svg, opts);
    var allowable = scene.allowable_strain * 100;
    var curves = {};
    var top = allowable;
    scene.joints.forEach(function (joint) {
      curves[joint] = fea.frames.map(function (frame) {
        return Math.max.apply(null, frame.strain[joint]) * 100;
      });
      top = Math.max(top, Math.max.apply(null, curves[joint]));
    });
    var scales = makeScales(box, scene.input_angles_deg, 0, top * 1.18);
    axes(
      svg,
      box,
      scales,
      { xLabel: opts.xLabel, format: function (v) { return v.toFixed(2); } },
      host
    );

    svg.appendChild(
      el("line", {
        x1: box.l,
        y1: scales.py(allowable),
        x2: box.w - box.r,
        y2: scales.py(allowable),
        stroke: style.critical,
        "stroke-width": 1.6,
        "stroke-dasharray": "6 3",
      })
    );
    var limit = el("text", {
      x: box.l + 4,
      y: scales.py(allowable) - 4,
      fill: style.critical,
      "font-size": 11,
    });
    limit.textContent =
      "allowable" + (scene.allowable_strain_is_placeholder ? " (placeholder)" : "");
    svg.appendChild(limit);

    var r = ramp(style, host);
    scene.joints.forEach(function (joint, i) {
      var colour = r[Math.min(i + 1, r.length - 1)];
      series(svg, scales, scene.input_angles_deg, curves[joint], colour, null, 1.8);
      var last = curves[joint].length - 1;
      tag(
        svg,
        scales.px(scene.input_angles_deg[last]),
        scales.py(curves[joint][last]),
        joint,
        colour
      );
    });
    crosshair(svg, box, scales, scene.input_angles_deg[index], host);
    return scene.joints;
  }

  /* Worst flexure at one state, and how much of the allowable it is using. */
  function worstStrain(scene, index) {
    var frame = frameOf(scene, "fea", index);
    if (!frame) return null;
    var best = { joint: null, value: -1 };
    Object.keys(frame.strain).forEach(function (joint) {
      var peak = Math.max.apply(null, frame.strain[joint]);
      if (peak > best.value) best = { joint: joint, value: peak };
    });
    if (best.joint === null) return null;
    best.utilisation = best.value / scene.allowable_strain;
    best.margin = scene.allowable_strain / (best.value || Infinity);
    return best;
  }

  root.CmtoolScene = {
    drawMechanism: drawMechanism,
    drawDeviation: drawDeviation,
    drawTorque: drawTorque,
    drawStrain: drawStrain,
    strainColour: strainColour,
    worstStrain: worstStrain,
    isDark: isDark,
    colourOf: colourOf,
    ramp: ramp,
    el: el,
    clear: clear,
  };
})(typeof window !== "undefined" ? window : this);
</script>
<script>
(function () {
  "use strict";
  const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  const S = PAYLOAD.scene;
  const ST = PAYLOAD.style;
  const SVGNS = "http://www.w3.org/2000/svg";

  const ink = (name) => getComputedStyle(document.documentElement)
    .getPropertyValue("--" + name).trim();

  // Read the theme off the rendered surface rather than the media query, so the
  // SVG colours follow whatever CSS actually applied.
  const dark = () => {
    const c = rgb(ink("surface") || "#ffffff");
    return (c[0] + c[1] + c[2]) / 3 < 128;
  };
  const colour = (key) => {
    const s = ST.series[key];
    return dark() ? s.dark : s.light;
  };
  const ramp = () => (dark() ? ST.rampDark : ST.rampLight);

  function strainColour(utilisation) {
    if (!isFinite(utilisation)) return ST.critical;
    if (utilisation >= 1) return ST.critical;
    const r = D.ramp(ST);
    const pos = Math.max(0, utilisation) * (r.length - 1);
    const lo = Math.min(Math.floor(pos), r.length - 2);
    return mix(r[lo], r[lo + 1], pos - lo);
  }
  function mix(a, b, f) {
    const pa = rgb(a), pb = rgb(b);
    return "#" + [0, 1, 2]
      .map((i) => Math.round(pa[i] + (pb[i] - pa[i]) * f).toString(16).padStart(2, "0"))
      .join("");
  }
  function rgb(hex) {
    const h = hex.replace("#", "");
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  }

  // --- drawing ---------------------------------------------------------
  // Every mark on this page is drawn by CmtoolScene, the same module the local
  // UI loads from the server. It is inlined above rather than fetched, so this
  // file still needs nothing from the network -- but it is the same source, so
  // the two renderers cannot drift apart.
  const D = window.CmtoolScene;
  const inkOf = (name) =>
    getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();

  const view = document.getElementById("view");
  const devSvg = document.getElementById("deviation");
  const has = (k) => Object.prototype.hasOwnProperty.call(S.models, k);

  const show = { rigid: has("rigid"), prbm: has("prbm"), fea: has("fea"),
                 measured: has("measured"), paths: true, trueScale: false };

  let devSeries = [];

  function draw(i) {
    D.drawMechanism(view, S, ST, i, { show: show });
  }

  function drawDeviation(i) {
    const card = document.getElementById("deviation-card");
    devSeries = D.drawDeviation(devSvg, S, ST, i, {
      width: devSvg.clientWidth || 520,
    });
    card.style.display = devSeries.length ? "" : "none";
  }


  // --- readouts --------------------------------------------------------
  const fmt = (v, d) => (v === null || v === undefined || !isFinite(v) ? "-" : v.toFixed(d));

  function worstStrain(i) {
    const frame = frameOf("fea", i);
    if (!frame) return null;
    let best = { joint: null, value: -1 };
    for (const joint in frame.strain) {
      const peak = Math.max.apply(null, frame.strain[joint]);
      if (peak > best.value) best = { joint: joint, value: peak };
    }
    return best;
  }

  function stat(key, value, unit) {
    return '<div class="stat"><div class="k">' + key + '</div><div class="v">' +
           value + '</div><div class="u">' + (unit || "") + '</div></div>';
  }

  function readouts(i) {
    const parts = [];
    for (const key of ["prbm", "fea"]) {
      const m = S.models[key];
      if (!m || !m.torque_nmm) continue;
      parts.push(stat(ST.series[key].label + " torque", fmt(m.torque_nmm[i], 1), "N&middot;mm"));
    }
    const worst = D.worstStrain(S, i);
    if (worst && worst.joint) {
      const util = worst.utilisation;
      parts.push(stat("peak strain", (worst.value * 100).toFixed(3) + "%",
                      "joint " + worst.joint));
      parts.push(stat("of allowable", (util * 100).toFixed(0) + "%",
                      S.allowable_strain_is_placeholder ? "against a placeholder" : "measured"));
    }
    document.getElementById("readouts").innerHTML = parts.join("");
  }

  function update(i) {
    draw(i);
    drawDeviation(i);
    readouts(i);
    document.getElementById("angle").textContent = S.input_angles_deg[i].toFixed(1);
    document.getElementById("sweep").textContent =
      (S.input_sweep_deg[i] >= 0 ? "+" : "") + S.input_sweep_deg[i].toFixed(1) +
      " deg from as-printed";
  }

  // --- chrome ----------------------------------------------------------
  function legend() {
    const parts = [];
    for (const key of ["rigid", "prbm", "fea", "measured"]) {
      if (!has(key)) continue;
      parts.push('<span><i class="swatch" style="border-top-color:' + D.colourOf(ST, key) +
        ";border-top-style:" + (ST.series[key].dash ? "dashed" : "solid") +
        '"></i>' + ST.series[key].label + " path</span>");
    }
    const r = D.ramp(ST);
    const bar = 'linear-gradient(90deg,' + r.join(",") + ')';
    parts.push('<span><i style="width:56px;height:10px;border-radius:2px;background:' +
      bar + '"></i>flexure strain, 0 to allowable' +
      (S.allowable_strain_is_placeholder ? " (placeholder: relative scale only)" : "") +
      "</span>");
    parts.push('<span><i class="swatch" style="border-top-color:' + ST.critical +
      '"></i>over allowable</span>');
    document.getElementById("legend").innerHTML = parts.join("");
  }

  function toggles() {
    const box = document.getElementById("toggles");
    const items = [];
    for (const key of ["rigid", "prbm", "fea", "measured"]) {
      if (has(key)) items.push([key, ST.series[key].label]);
    }
    items.push(["paths", "paths"]);
    items.push(["trueScale", "true flexure width"]);
    box.innerHTML = items.map(function (it) {
      return '<button data-key="' + it[0] + '" aria-pressed="' + (show[it[0]] ? "true" : "false") +
        '">' + it[1] + "</button>";
    }).join("");
    box.addEventListener("click", function (event) {
      const button = event.target.closest("button[data-key]");
      if (!button) return;
      const key = button.dataset.key;
      show[key] = !show[key];
      button.setAttribute("aria-pressed", show[key] ? "true" : "false");
      update(Number(slider.value));
      scaleNote();
    });
  }

  function scaleNote() {
    const thick = Object.keys(S.flexure_thickness_mm)
      .map(function (j) { return S.flexure_thickness_mm[j]; });
    const min = Math.min.apply(null, thick);
    document.getElementById("scale-note").textContent = show.trueScale
      ? "Flexures drawn at true width (" + min.toFixed(2) + " mm). Links are " +
        S.link_width_mm.toFixed(0) + " mm."
      : "Flexures are " + min.toFixed(2) + " mm thick beside " +
        S.link_width_mm.toFixed(0) + " mm links, so they are drawn at a minimum of " +
        ST.minFlexureMm.toFixed(1) + " mm to keep the strain colour legible. " +
        "Everything else is to scale; toggle \u201ctrue flexure width\u201d for the honest one.";
  }

  function tables() {
    const joints = S.joints;
    const head = ["step", "angle (deg)", "sweep (deg)"];
    if (S.models.prbm && S.models.prbm.torque_nmm) head.push("PRBM T (N\u00b7mm)");
    if (S.models.fea && S.models.fea.torque_nmm) head.push("FEA T (N\u00b7mm)");
    const feaFrames = S.models.fea && S.models.fea.frames;
    if (feaFrames) for (const j of joints) head.push("strain " + j + " (%)");

    let html = "<thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") +
               "</tr></thead><tbody>";
    for (let i = 0; i < S.input_angles_deg.length; i++) {
      const row = [i, S.input_angles_deg[i].toFixed(2), S.input_sweep_deg[i].toFixed(2)];
      const tp = S.models.prbm && S.models.prbm.torque_nmm;
      const tf = S.models.fea && S.models.fea.torque_nmm;
      if (tp) row.push(tp[i].toFixed(2));
      if (tf) row.push(tf[i].toFixed(2));
      if (feaFrames) {
        for (const j of joints) {
          row.push((Math.max.apply(null, feaFrames[i].strain[j]) * 100).toFixed(3));
        }
      }
      html += "<tr>" + row.map((c) => "<td>" + c + "</td>").join("") + "</tr>";
    }
    document.getElementById("table").innerHTML = html + "</tbody>";

    let gaps = "<thead><tr><th>pair</th><th>mean (mm)</th><th>max (mm)</th>" +
               "<th>Frechet (mm)</th><th>samples</th></tr></thead><tbody>";
    for (const c of S.comparisons) {
      gaps += "<tr><td>" + c.a + " vs " + c.b + "</td><td>" + fmt(c.mean_mm, 3) +
        "</td><td>" + fmt(c.max_mm, 3) + "</td><td>" + fmt(c.frechet_mm, 3) +
        "</td><td>" + c.n_points + "</td></tr>";
    }
    document.getElementById("gaps").innerHTML = gaps + "</tbody>";
  }

  function chrome() {
    const meta = S.meta || {};
    document.getElementById("subtitle").textContent =
      S.joints.length + " flexures, " + S.input_angles_deg.length + " precomputed states over " +
      meta.input_range_deg[0].toFixed(1) + " to " + meta.input_range_deg[1].toFixed(1) +
      " deg; printed unstressed at " + meta.reference_input_deg.toFixed(1) + " deg (" +
      meta.material + " on " + meta.printer + ")";

    const banner = document.getElementById("banner");
    let html = "";
    if (S.caveat) {
      html += '<div class="banner"><strong>Not a physical prediction.</strong> ' +
        "Placeholder inputs were used, so these numbers show that the pipeline runs, " +
        "not what the printed part will do. Waiting on: <code>" +
        S.provenance.placeholders_used.join(", ") + "</code></div>";
    }
    for (const note of S.notes || []) {
      html += '<div class="banner" style="border-left-color:var(--muted)">' + note + "</div>";
    }
    banner.innerHTML = html;

    const p = S.provenance;
    document.getElementById("prov").innerHTML =
      "cmtool " + p.version + " &middot; commit <code>" + p.code_commit + "</code>" +
      " &middot; config <code>" + (p.config_hash || "n/a") + "</code>" +
      " &middot; generated " + p.created_utc;
  }

  // --- playback --------------------------------------------------------
  const slider = document.getElementById("slider");
  slider.max = String(S.input_angles_deg.length - 1);
  slider.addEventListener("input", function () { update(Number(slider.value)); });

  const playButton = document.getElementById("play");
  let timer = null, direction = 1;
  playButton.addEventListener("click", function () {
    if (timer) {
      clearInterval(timer);
      timer = null;
      playButton.textContent = "Play";
      playButton.setAttribute("aria-pressed", "false");
      return;
    }
    playButton.textContent = "Pause";
    playButton.setAttribute("aria-pressed", "true");
    timer = setInterval(function () {
      let next = Number(slider.value) + direction;
      // Bounce rather than jump: the arc is limited, and a flexure mechanism
      // snapping from one end back to the other is not a motion it can make.
      if (next > Number(slider.max)) { direction = -1; next = Number(slider.max) - 1; }
      if (next < 0) { direction = 1; next = 1; }
      slider.value = String(next);
      update(next);
    }, 70);
  });

  window.addEventListener("resize", function () { update(Number(slider.value)); });

  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", function () {
      legend();
      update(Number(slider.value));
    });

  document.getElementById("deviation-title").textContent =
    "Coupler path, distance from the " + (S.deviation_reference || "reference") +
    " path (mm)";
  document.getElementById("deviation-note").textContent = devSeries.length
    ? "A flat line at zero is not a missing series: with a prescribed input and " +
      "pivot-matched placement the PRBM path is the rigid path exactly, because " +
      "stiffness cannot move a one-degree-of-freedom path. Only the FEA, which lets " +
      "the flexures stretch and shear, departs from it."
    : "";

  chrome();
  legend();
  toggles();
  scaleNote();
  tables();
  update(0);
})();
</script>
</body>
</html>
