# Material definition for cmtool.
#
# DATA DISCIPLINE (see docs/physics.md):
#   Every physical quantity carries `status`.
#     measured    -> obtained from our own test, with provenance below
#     vendor      -> taken from a datasheet, cited
#     placeholder -> NOT a measurement. `value` is null; `provisional_value` exists
#                    only so that code can execute. Any result computed from a
#                    provisional value is stamped `placeholders_used` and must never
#                    be reported as a physical prediction.

name: PLA
long_name: "Polylactic acid, FDM printed"
supplier:
  brand: "eSun"
  brand_status: confirmed
  # Product line matters: eSun PLA and PLA+ are different materials with different
  # moduli and ductility. Do not treat measurements from one as applying to the other.
  product_line: null   # PLACEHOLDER: "PLA" or "PLA+", from the spool label
  colour: null         # PLACEHOLDER: from the spool label (pigment changes modulus measurably)
  lot_id: null         # PLACEHOLDER: from the spool label
  spool_count: 2
  note: "Both spools from the same lot, so Phase A and B share one material batch." 

properties:
  youngs_modulus_MPa:
    value: null
    provisional_value: 3500.0
    status: placeholder
    source: "Generic order-of-magnitude range for printed PLA (~2500-4000 MPa). NOT a measurement."
    note: "PLACEHOLDER: replace with measured value from the A3 cantilever strip test."
    measured_at_rate_mm_per_s: null
    measured_orientation: null
    measured_date: null

  density_kg_per_m3:
    value: null
    provisional_value: 1240.0
    status: placeholder
    source: "Generic bulk PLA density. NOT a measurement; printed parts are less dense (infill/voids)."
    note: "PLACEHOLDER: replace with measured value (weigh a printed strip of known volume)."

  allowable_strain:
    value: null
    provisional_value: 0.01
    status: placeholder
    source: "Conservative guess only. NOT a measurement."
    note: |
      PLACEHOLDER: replace with measured value. This is the single most important number
      for feasibility filtering (strain limit drives the maximum joint excursion).
      Determine from the cantilever strip tests plus a deliberate flexure-to-failure test.

  yield_stress_MPa:
    value: null
    provisional_value: 50.0
    status: placeholder
    source: "Generic order-of-magnitude for printed PLA. NOT a measurement."
    note: "PLACEHOLDER: replace with measured value."

# Viscoelasticity is real and matters (see docs/physics.md, disagreement 4).
# Phase A does not model it; these fields exist so Phase C can fill them.
viscoelastic:
  modelled: false
  creep_note: "Not modelled in Phase A. Filming protocol must log settle time."
