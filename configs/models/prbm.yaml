# Pseudo-rigid-body model constants.
#
# These are PUBLISHED MODEL PARAMETERS, not measurements and not guesses, so they
# carry status: literature and a citation. They are legitimate to use and report,
# unlike a placeholder -- but they are not ours.
#
# IMPORTANT, AND EASY TO GET WRONG: Howell gives DIFFERENT constants for different
# end loadings, and the two cases do not even use the same stiffness formula.
#
#   end force   K = gamma * K_Theta * E I / L
#   end moment  K = K_Theta * E I / L            (no gamma)
#
# Multiplying gamma by K_Theta for the moment case gives ~1.11, which looks like it
# would almost erase the stiffness step at the model boundary. It does not: the
# correct end-moment stiffness is ~1.50 E I / L, so the step falls from 2.25x to
# 1.50x rather than to 1.0x. See docs/physics.md section 5.
#
# The end-moment values here were checked INDEPENDENTLY, not merely cited. A
# cantilever under a pure end moment bends to uniform curvature, so its exact tip
# path is a circular arc in closed form. Fitting the PRBM to that arc gives
# gamma -> 0.750 and K_Theta -> 1.500 in the small-angle limit, and 0.746 / 1.498
# fitted out to 64 degrees. That is the derivation in tests/validation/test_prbm.py,
# and it agrees with the quoted 0.7346 / 1.5164 to about 2 percent -- the spread you
# would expect between different fitting ranges and objectives.
#
# The end-FORCE values (0.85 / 2.65) have NOT been independently derived here.
# Milestone A4's beam FEA is what checks them and decides which loading case
# actually represents a flexure joint in our mechanisms.

name: "prbm"

small_length:
  description: "Small-length flexural pivot: pin at the flexure centre, K = E I / L."
  characteristic_pivot_fraction:
    value: 0.5
    status: literature
    source: "Direct consequence of uniform curvature over a short segment; Howell (2001), Compliant Mechanisms, ch. 5."
  stiffness_coefficient:
    value: 1.0
    status: literature
    source: "K = E I / L exactly; no fitted coefficient enters the small-length model."
  stiffness_formula: "k_theta_ei_over_l"
  length_ratio_limit:
    value: 0.1
    status: design_choice
    source: |
      Usual rule of thumb for when a flexure counts as 'small-length'. This is a MODEL
      SELECTION threshold and metadata, NOT a feasibility filter: designs beyond it are
      kept deliberately, because Phase C's fidelity map needs cases where the simple
      model fails.

long_segment:
  # Howell's PRBM for a flexible segment. The beam is replaced by a rigid link of
  # length gamma*L pinned at (1 - gamma)*L FROM THE ROOT, with a torsional spring
  # at that pivot.
  #
  # The pivot location convention matters and is easy to invert. Fitting the exact
  # circular arc with the pivot at (1-gamma)L reproduces the tip path to 2e-4 L;
  # putting it at gamma*L instead is off by 0.15 L, roughly 900 times worse, and for
  # gamma = 0.85 the rigid link is then too short to reach the tip at all. See
  # tests/validation/test_prbm.py::TestPivotConvention.
  description: "Howell long-segment PRBM: pivot at (1 - gamma) L from the root."

  # Which variant the toolkit currently applies. A4's beam FEA determines this;
  # until it has run, the choice is recorded rather than assumed.
  active_variant: "end_moment"
  active_variant_status: measured
  active_variant_source: |
    Determined by our own beam FEA, not assumed. `cmtool prbm-study` loads a cantilever
    flexure with a tip moment M and transverse force P at ratio lambda = P L / M, and
    fits gamma and K to the resulting tip path.

    A flexure joint is moment-dominated. Under no external load the only forces in a
    compliant four-bar are those bending the other flexures, so the moment a flexure
    carries is of order K*dphi ~ (EI/L) dphi while the transverse force is of order
    that divided by a link length. Their ratio is lambda ~ L/l, the flexure's own
    length ratio: about 0.1 for our designs.

    At lambda = 0.1 the FEA gives gamma = 0.754 and K = 1.523 EI/L. The end_moment
    variant is within 0.5 percent on stiffness; end_force is off by 48 percent.
    Run `cmtool prbm-study` to reproduce.

  max_angle_deg:
    value: 64.3
    status: literature
    source: "Howell (2001): approximate upper bound on the PRBM angle for which the model stays accurate."
    note: "VERIFY. Used only as a reported warning threshold, never as a filter."

  variants:
    end_force:
      description: "Cantilever with a transverse force at the free end."
      stiffness_formula: "gamma_k_theta_ei_over_l"
      gamma:
        value: 0.85
        status: literature
        source: "Howell (2001), Compliant Mechanisms, ch. 5: characteristic radius factor, transverse end force."
        note: |
          VERIFY against the reference tables, and note that gamma varies with the load
          ratio n (transverse vs axial end force). NOT independently derived here --
          unlike the end-moment values, which are.
      stiffness_coefficient:
        value: 2.65
        status: literature
        source: "Howell (2001), ch. 5: stiffness coefficient K_Theta for a transverse end force."
        note: "VERIFY together with gamma."
      stiffness_multiple_of_ei_over_l: 2.2525

    end_moment:
      description: "Cantilever with a pure moment at the free end; bends to a circular arc."
      stiffness_formula: "k_theta_ei_over_l"
      gamma:
        value: 0.7346
        status: literature
        source: "Howell (2001), ch. 5: characteristic radius factor for pure end-moment loading."
        note: |
          Independently corroborated: fitting the exact circular-arc solution gives
          0.750 in the small-angle limit and 0.746 out to 64 degrees. Agreement to
          about 2 percent.
      stiffness_coefficient:
        value: 1.5164
        status: literature
        source: "Howell (2001), ch. 5: stiffness coefficient K_Theta for pure end-moment loading."
        note: |
          Independently corroborated: the exact arc gives K_Theta = 3/2 exactly in the
          small-angle limit (M = EI*theta/L and Theta = theta/(2*gamma) with
          gamma = 3/4). Note this variant does NOT multiply by gamma.
      stiffness_multiple_of_ei_over_l: 1.5164

verification:
  verified_against_fea: true
  verified_date: "2026-09-20"
  note: |
    Checked against our own 2D co-rotational beam FEA (milestone A4), which is itself
    validated against two analytical references: a cantilever under a pure end moment
    (exact circular arc) and under a transverse end load (Bisshopp-Drucker quadrature).
    The FEA reproduces both to better than 1e-4 of the beam length at 32 elements.

    Fitting the PRBM to the FEA reproduces both loading cases:
      lambda = 0    (pure moment) -> gamma 0.749, K 1.500 EI/L   vs 0.7346 / 1.5164
      lambda = 5    (force heavy) -> gamma 0.819, K 1.949 EI/L   vs 0.85   / 2.2525
    The end-moment constants agree to about 2 percent. The end-force constants are
    corroborated in trend but not yet to that precision, because the sweep does not
    reach the pure-force limit; that remains open.
  independently_derived:
    end_moment_gamma: true
    end_moment_stiffness_coefficient: true
    end_force_gamma: false
    end_force_stiffness_coefficient: false
  stiffness_step_at_model_boundary:
    with_end_moment_variant: 1.5164
    with_end_force_variant: 2.2525
    note: |
      Ratio of long-segment to small-length stiffness where the models switch.
      Physical stiffness is continuous, so neither model is reliable near the
      threshold. Choosing the end-moment variant reduces the step from 2.25x to
      1.52x -- a real improvement, but it does not remove it.

geometry:
  # A flexure is a necked-down section of a link, so it cannot occupy the whole
  # link: some rigid material has to remain at each end for the joint to be a
  # joint. THIS is the hard geometric limit on flexure length.
  max_length_fraction_of_link:
    value: 0.8
    status: design_choice
    source: |
      Leaves 20 percent of the shorter adjacent link as rigid material. Replaces the
      0.1 small-length ratio as the hard cap on flexure length; the 0.1 ratio now only
      selects the PRBM model and is recorded as metadata.
