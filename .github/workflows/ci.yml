name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        # uv run below uses --no-sync, so this step is the single place the
        # environment is defined.
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra plot --extra data --extra cad --extra vision --extra ui

      - name: Test
        run: uv run --no-sync pytest --cov=cmtool --cov-report=term-missing --cov-report=xml

  quality:
    name: lint, types and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --python 3.12 --extra dev --extra plot --extra data --extra cad --extra vision --extra ui

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Format check
        run: uv run --no-sync ruff format --check src tests

      - name: Type check
        run: uv run --no-sync mypy

      - name: Check committed JSON schemas are up to date
        run: |
          uv run --no-sync python -m cmtool.schema.export --out src/cmtool/schema/json
          git diff --exit-code -- src/cmtool/schema/json
